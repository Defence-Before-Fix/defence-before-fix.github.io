{% assign s = site.data.site %}
<header class="site-header">
  <p class="site-title"><a href="{{ '/' | relative_url }}">{{ s.name }}</a></p>
  <nav aria-label="Site">
    {% for p in s.pages %}{% if p.path != '/' %}<a href="{{ p.path | relative_url }}">{{ p.nav }}</a>
    {% endif %}{% endfor %}
  </nav>
  <p class="site-byline">By <a href="{{ s.author.url }}">{{ s.author.name }}</a> of
    <a href="{{ s.organisation.url }}">{{ s.organisation.name }}</a>. First published {{ s.coined }}.</p>
</header>
