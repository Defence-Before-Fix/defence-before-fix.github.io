<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-GB' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {% seo %}
  {% include head-custom.html %}
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  {% assign s = site.data.site %}{% for p in s.pages %}{% if p.raw and p.path == page.url %}<link rel="alternate" type="text/markdown" href="{{ '/raw/' | append: p.raw | relative_url }}" title="Raw markdown">
  {% endif %}{% endfor %}<link rel="alternate" type="text/plain" href="{{ s.agent_index | relative_url }}" title="llms.txt">
</head>
<body>
  {% include header.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
