title: Defence Before Fix (DBF)
description: A phase that runs before a defect is fixed. The method, detector and toolchain specifications.
lang: en-GB
author: Joseph Edmonds
plugins:
  - jekyll-relative-links
  - jekyll-seo-tag
relative_links:
  enabled: true
  collections: false
defaults:
  - scope:
      path: ""
    values:
      layout: default
exclude:
  - spec-qa.py
  - tools/build-register.py
  - build-agent-surfaces.py
  - defence-before-fix-project-prompt.md
  - LICENSE
  - README.md
  - PUBLISHING.md
  - .github
  - composer.json
  - package.json
