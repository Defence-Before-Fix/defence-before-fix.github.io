name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Agent surfaces into the built site (raw markdown, prompt, llms.txt)
        run: |
          pip install pyyaml
          sudo python3 build-agent-surfaces.py --check --site ./_site
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: register/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: register/pnpm-lock.yaml
      - name: The tools register application
        working-directory: register
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: The register application into the built site
        run: |
          sudo mkdir -p _site/tools/app
          sudo cp register/dist/*.js register/dist/*.css _site/tools/app/
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
