name: spec-qa
on:
  push:
  pull_request:
jobs:
  spec-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The clause link checker's own tests
        run: python3 -m unittest tools/test_clauses.py
      - name: Terminology, link and clause-link discipline over the specifications and every page
        run: python3 spec-qa.py
      - name: The tools register table and JSON match the tool pages
        run: python3 tools/build-register.py --check
      - name: The agent surfaces match the specification and the metadata
        run: pip install pyyaml && python3 build-agent-surfaces.py --check
  register-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: register
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: register/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: register/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: The register application's own full pipeline, read-only
        run: pnpm exec ts-qa
      - name: The register application builds
        run: pnpm run build
