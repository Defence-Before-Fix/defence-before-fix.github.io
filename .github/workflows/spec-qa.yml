name: spec-qa
on:
  push:
  pull_request:
jobs:
  spec-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Terminology and link discipline over both specifications
        run: python3 spec-qa.py
