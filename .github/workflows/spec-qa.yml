name: spec-qa
on:
  push:
  pull_request:
jobs:
  spec-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The checkers' own tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Terminology, links, clause links, house style, version agreement and key quotations
        run: python3 spec-qa.py
      - name: A changed specification carries a changelog entry, and a changed obligation a version
        if: github.event_name == 'pull_request'
        run: python3 tools/changes.py --base "origin/${{ github.base_ref }}"
      - name: The tools register table and JSON match the tool pages
        run: python3 tools/build-register.py --check
      - name: The agent surfaces match the specification and the metadata
        run: pip install pyyaml && python3 build-agent-surfaces.py --check
  register-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: register
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: register/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: register/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: The register application's own full pipeline, read-only
        run: pnpm exec ts-qa
      - name: The register application builds
        run: pnpm run build
